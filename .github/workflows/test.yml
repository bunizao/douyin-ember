name: Test

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.15"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run --locked playwright install --with-deps chromium
      - run: uv run --locked python -m pytest -q
